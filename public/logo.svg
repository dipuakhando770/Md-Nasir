<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b38" />
      <stop offset="50%" stop-color="#071126" />
      <stop offset="85%" stop-color="#030814" />
      <stop offset="100%" stop-color="#01040a" />
    </radialGradient>

    <!-- Outer Cyan Ring Glow -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Metallic Silver/Chrome Gradient -->
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Cyber Blue/Cyan 3D Gradient -->
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Bright Electric Cyan Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" />

  <!-- Outer Neon Blue Glowing Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#neonRing)" stroke-width="8" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00d2ff" stroke-width="3" opacity="0.9" />

  <!-- Subtle Inner Tech Orbit Track -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Center 3D Geometric "ND" Monogram Emblem -->
  <g transform="translate(4, -12)">
    <!-- Orbit Swoosh behind/through ND -->
    <path d="M 120 270 C 120 200, 220 145, 350 160 C 400 165, 410 210, 370 250 C 320 300, 210 305, 140 275" 
          fill="none" stroke="url(#silverChrome)" stroke-width="7" stroke-linecap="round" opacity="0.95" />
    
    <!-- Outer Cyan Sweeping Loop for "D" -->
    <path d="M 235 155 C 340 155, 410 200, 380 270 C 355 315, 270 310, 210 290" 
          fill="none" stroke="url(#cyberBlue)" stroke-width="18" stroke-linecap="round" />
    <path d="M 235 155 C 340 155, 410 200, 380 270 C 355 315, 270 310, 210 290" 
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- 3D "N" Left Pillar (Silver/Blue) -->
    <polygon points="160,135 215,185 215,295 160,245" fill="url(#cyberBlue)" />
    <polygon points="160,135 180,115 235,165 215,185" fill="url(#silverChrome)" />

    <!-- 3D "N" Diagonal & Right Pillar (Metallic Chrome) -->
    <polygon points="215,185 305,275 305,155 260,115 260,230 180,150" fill="url(#silverChrome)" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />

    <!-- Digital Tech Pixel Blocks (Top Right of "D") -->
    <rect x="360" y="145" width="18" height="18" fill="#00e5ff" rx="3" filter="url(#neonGlow)" />
    <rect x="385" y="145" width="18" height="18" fill="#38bdf8" rx="3" />
    <rect x="385" y="170" width="18" height="18" fill="#0284c7" rx="3" />
    <rect x="360" y="170" width="18" height="18" fill="#00e5ff" rx="3" />
    <rect x="372" y="195" width="16" height="16" fill="#38bdf8" rx="2" />

    <!-- Center Lens Flare Star -->
    <circle cx="340" cy="265" r="5" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="340" cy="265" r="2.5" fill="#ffffff" />
  </g>

  <!-- Brand Typography: "NASIR" in Metallic Chrome -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="4"
        fill="url(#silverChrome)"
        style="text-shadow: 0 4px 12px rgba(0,0,0,0.8);">
    NASIR
  </text>

  <!-- Brand Typography: "DIGITAL HUB" in Glowing Electric Cyan -->
  <text x="256" y="424" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6"
        fill="url(#electricCyan)"
        filter="url(#neonGlow)">
    DIGITAL HUB
  </text>
  <text x="256" y="424" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="6"
        fill="#ffffff">
    DIGITAL HUB
  </text>

  <!-- Bottom Cyber Circuit Line & Center Node Dot -->
  <line x1="150" y1="446" x2="236" y2="446" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="446" r="7" fill="#0b1b38" stroke="#00e5ff" stroke-width="3" />
  <circle cx="256" cy="446" r="3" fill="#ffffff" />
  <line x1="276" y1="446" x2="362" y2="446" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
</svg>
